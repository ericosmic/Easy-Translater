<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Translator</title>
  <link rel="stylesheet" href="viewer.css">
</head>
<body>
  <div id="toolbar">
    <span class="toolbar-title" data-i18n="viewerTitle">PDF 翻译</span>
    <span id="page-info"></span>
    <div class="toolbar-spacer"></div>
    <select id="source-lang" class="tb-select">
      <option value="auto" data-i18n="autoDetect">自动检测</option>
      <option value="English">English</option>
      <option value="中文">中文</option>
      <option value="日本語">日本語</option>
      <option value="한국어">한국어</option>
      <option value="Français">Français</option>
      <option value="Deutsch">Deutsch</option>
      <option value="Español">Español</option>
      <option value="Русский">Русский</option>
    </select>
    <span class="tb-arrow">→</span>
    <select id="target-lang" class="tb-select">
      <option value="中文">中文</option>
      <option value="English">English</option>
      <option value="日本語">日本語</option>
      <option value="한국어">한국어</option>
      <option value="Français">Français</option>
      <option value="Deutsch">Deutsch</option>
      <option value="Español">Español</option>
      <option value="Русский">Русский</option>
    </select>
    <button id="translate-btn" class="tb-btn tb-primary">🌐 <span data-i18n="viewerTranslate">翻译</span></button>
    <button id="toggle-btn" class="tb-btn" style="display:none">↩ <span data-i18n="viewerToggleOrig">原文</span></button>
    <button id="prev-btn" class="tb-btn" disabled>◀</button>
    <span id="page-num"></span>
    <button id="next-btn" class="tb-btn" disabled>▶</button>
  </div>
  <div id="viewer-container">
    <div id="loading">Loading PDF...</div>
  </div>

  <script src="../i18n.js"></script>
  <script src="pdf.min.js"></script>
  <script src="viewer.js"></script>
</body>
</html>
